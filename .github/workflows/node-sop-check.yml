name: Node.js API SOP Check

on:
  pull_request:
    branches: [development, main]
  push:
    branches: ['**']

jobs:
  node_sop_check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run Node.js API SOP Check
        run: npm run sop:check
